name: Who's from ? 2-3
category: Réaliste
description: |-
  Bien, on arrive bientot à bout ! L'attaquant a peut être changé le mot de passe de la machine, mais il a aussi probablement laissé une backdoor pour s'y reconnecté.

  Trouve comment l'attaquant arrive à se connecter à la machine a partir du fichier qu'il a déposé !

  Flag: `CYBN{<protocol>:<port source>:<port distant>}`
attribution: Romain
value: 500
type: dynamic

extra:
  initial: 500
  decay: 30
  minimum: 100

flags:
- content: CYBN{tcp:42069:22}
  type: static
  data: case_insensitive

tags:
- Medium
- Reverse

files:
- dist/cybernight.ko

requirements:
  prerequisites:
  - Sanity Check
  - Who's there ? 1-3
  anonymize: false

version: '0.1'
