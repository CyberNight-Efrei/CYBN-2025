name: "Orderrrrrrrr"
category: "Web"
description: |-
    Un ami m'a toujours dit que PHP était un langage prone aux vulnérabilités, et qu'à partir du moment où on utilise un framework, il est impossible d'introduire des failles dans un site.
    Je lui ai toujours répondu que non : PHP est un outil. Framework ou pas, si le développeur code n'importe comment, c'est sa responsabilité, pas celle du langage ni du framework.

    Pour lui démontrer ce point, trouve une vulnérabilité sur son site !
