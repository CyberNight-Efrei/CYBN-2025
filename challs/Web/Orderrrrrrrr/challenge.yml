name: "Orderrrrrrrr"
category: "Web"
description: |-
    Un ami m'a toujours dit que PHP était un langage prone aux vulnérabilités, et qu'à partir du moment où on utilise un framework, il est impossible d'introduire des failles dans un site.
    Je lui ai toujours répondu que non : PHP est un outil. Framework ou pas, si le développeur code n'importe comment, c'est sa responsabilité, pas celle du langage ni du framework.

    Pour lui démontrer ce point, trouve une vulnérabilité sur son site !
attribution: "Romain"
value: 500
# <============ CHALLENGE DOCKER ============>
# REMOVE IF NO DOCKER

type: dynamic_docker

extra:
  dynamic_score: 1      # 1 = True / 0 = False
  dynamic_initial: 500  # NE PAS TOUCHER
  dynamic_decay: 42     # NE PAS TOUCHER
  dynamic_minimum: 100  # NE PAS TOUCHER

  docker_image: web_order   # RESPECT FORMAT (shortname please)

  redirect_type: http   # Protocol. Default should be tcp
  redirect_port: 80               # App port, do not mind overlaps

# </============ CHALLENGE DOCKER ============>

flags:
    - CYBN{0RM_C4NT_F1X_B4D_D3VS}

tags:
    - Hard

requirements:
  - "Bienvenue !"

files:
    - src/web.zip

version: "0.1"
