name: "Session rattrapage"
category: "Web"
description: |-
    Une nouvelle plateforme de consultation de notes vient d'être mise en ligne... mais quelque chose cloche !
    Dès la création d'un compte, tous les utilisateurs se retrouvent mystérieusement avec de mauvaises notes.
    Une rumeur circule comme quoi le tout premier inscrit sur la plateforme aurait réussi à obtenir de très bonnes notes...
    Seras-tu capable de te faire passer pour lui et découvrir son secret ?
attribution: "Romain"
value: 500
# <============ CHALLENGE DOCKER ============>
# REMOVE IF NO DOCKER

type: dynamic_docker

extra:
  dynamic_score: 1      # 1 = True / 0 = False
  dynamic_initial: 500  # NE PAS TOUCHER
  dynamic_decay: 42     # NE PAS TOUCHER
  dynamic_minimum: 100  # NE PAS TOUCHER

  docker_image: web_rattrapage   # RESPECT FORMAT (shortname please)

  redirect_type: http   # Protocol. Default should be tcp
  redirect_port: 80               # App port, do not mind overlaps

# </============ CHALLENGE DOCKER ============>

flags:
    - CYBN{4lw4y5_Ch3ck_ALL_Us3r_D4t4}

tags:
    - Easy

requirements:
  - "Bienvenue !"

files:
    - src/web.zip

version: "0.1"
