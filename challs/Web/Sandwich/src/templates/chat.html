{% extends 'base.html' %}
{% block content %}
<h2>Discussion</h2>
<div id="chat-container" style="max-height:500px; overflow-y:auto; padding:10px; display:flex; flex-direction:column; gap:15px; border:1px solid #b36b00; border-radius:10px; background-color:#fff8f0;">
    <!-- Les messages seront injectés ici via JS -->
</div>

<form id="chat-form" style="margin-top:15px; display:flex; gap:10px;">
    <input name="content" type="text" placeholder="Écrire un message..." required
           style="flex:1; padding:10px; border-radius:10px; border:1px solid #b36b00;">
    <button type="submit" style="padding:10px 20px; border-radius:10px; border:none; background-color:#b36b00; color:white;">Envoyer</button>
</form>

<script>
const chatContainer = document.getElementById('chat-container');
const form = document.getElementById('chat-form');

// Email pour le chat
const chatUserEmail = "{{ current_user.email }}";

async function fetchMessages() {
    try {
        const res = await fetch('/api/messages');
        if (!res.ok) throw new Error("Erreur lors du chargement des messages");
        const messages = await res.json();
        chatContainer.innerHTML = '';

        messages.forEach(msg => {
            const div = document.createElement('div');
            div.style.display = 'flex';
            div.style.alignItems = 'flex-start';
            div.style.gap = '10px';

            const isCurrentUser = msg.user.email === chatUserEmail;

            if (!isCurrentUser) {
                const img = document.createElement('img');
                img.src = msg.user.profile_picture_url;
                img.style.width = '40px';
                img.style.height = '40px';
                img.style.borderRadius = '50%';
                img.style.objectFit = 'cover';
                div.appendChild(img);
            }

            const bubble = document.createElement('div');
            bubble.style.maxWidth = '70%';
            bubble.style.padding = '10px 15px';
            bubble.style.borderRadius = '15px';
            bubble.style.boxShadow = '0 2px 5px rgba(0,0,0,0.1)';
            bubble.style.wordWrap = 'break-word';
            bubble.style.backgroundColor = isCurrentUser ? '#b36b00' : '#fff1e6';
            bubble.style.color = isCurrentUser ? 'white' : '#5a3e36';

            bubble.innerHTML = `<strong>${msg.user.name}</strong><br>${msg.content}
                <div style="font-size:0.75em; color:#8c5a3e; text-align:right; margin-top:5px;">
                ${msg.timestamp}</div>`;

            div.appendChild(bubble);

            if (isCurrentUser) {
                const img = document.createElement('img');
                img.src = msg.user.profile_picture_url;
                img.style.width = '40px';
                img.style.height = '40px';
                img.style.borderRadius = '50%';
                img.style.objectFit = 'cover';
                div.appendChild(img);
                div.style.justifyContent = 'flex-end';
            }

            chatContainer.appendChild(div);
        });

        chatContainer.scrollTop = chatContainer.scrollHeight;
    } catch (err) {
        console.error(err);
    }
}

// Charger les messages au chargement
fetchMessages();

// Envoyer un message via API et rafraîchir la liste
form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const content = form.content.value.trim();
    if (!content) return;

    try {
        const res = await fetch('/api/messages', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({content})
        });

        if (!res.ok) throw new Error("Erreur lors de l'envoi du message");

        form.content.value = '';
        await fetchMessages();
    } catch (err) {
        console.error(err);
        alert("Impossible d'envoyer le message. Veuillez réessayer.");
    }
});
</script>

{% endblock %}
