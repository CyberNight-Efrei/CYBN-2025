name: "No Time To Flag"
category: Hardware
description: |-
    <i>Ce challenge est à flag sur le PCB.</i>

    Place aux choses sérieuses. Pourrez-vous retrouver le flag (sans dump le firmware) ?

    Ressources :
    - [Timing attack, Wikipedia](https://en.wikipedia.org/wiki/Timing_attack)
    - [ATmega328P Datasheet page 149 (USART code example), Atmel](https://ww1.microchip.com/downloads/en/DeviceDoc/Atmel-7810-Automotive-Microcontrollers-ATmega328P_Datasheet.pdf#page=149)

    Notes : 
    - Sélectionnez `ch2` sur le PCB.
    - Format du flag : `CYBN{example_lowercase_no_accent}`

    Bon courage.

    <div class="text-center">
        <img src="https://raw.githubusercontent.com/ice-efrei/charte-graphique/refs/heads/master/logo/logo%20vertical%20blanc%20transparent-1.svg" class="img-fluid" width=150>
    </div>
attribution: "grégoire - ICE"
value: 500
type: dynamic

extra:
    initial: 500
    decay: 30
    minimum: 100

flags:
    - CYBN{sous_grosse_side_channel}

tags:
    - Hard

# Include la librairie serial ?
files:
    - src/main.c
    - src/serial.h
    - src/serial.c

requirements:
    - "Sanity Check"
    - "Pull up! Pull up!"

state: visible

version: "0.1"
