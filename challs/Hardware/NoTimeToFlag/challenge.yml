name: "No Time To Flag"
category: Hardware
description: |-
    Inspecteur ! J'ai trouvé ce programme chez le suspect ! Mais comment diantre obtenir le flag...
    <i>Format du flag : CYBN{example_lowercase_no_accent}
    Afin de réussir ce challenge, il est vivement conseillé d'utiliser la HAL (Hardware Abstraction Layer) de Atmel à la place du framework Arduino.
    Il vous faut donc les outils suivants :
    - `avr-gcc`
    - `avr-objcopy`
    - `avrdude`
    Pensez à ajouter les lignes suivantes en haut de votre programme :
    ```c
    #define __AVR_ATmega328P__
    #define F_CPU 16000000UL
    #include <avr/io.h>
    #include <util/delay.h>
    ```
    Les commandes pour build et upload un programme sur un Arduino sont :
    ```sh
    avr-gcc -mmcu=atmega328p -Os -o solve.elf solve.c
    avr-objcopy -O ihex solve.elf solve.hex
    avrdude -c arduino -p m328p -P /dev/ttyUSB0 -b 115200 -U flash:w:solve.hex
    ```
    Bon courage.</i>

attribution: grégoire
value: 500
type: dynamic

extra:
    initial: 500
    decay: 30
    minimum: 100

flags:
    - CYBN{sous_grosse_side_channel}

tags:
    - Hard

# Include la librairie serial ?
files:
    - src/main.c
    - src/serial.h
    - src/serial.c

state: visible

version: "0.1"
