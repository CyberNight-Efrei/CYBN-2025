name: "Voice from the Void"
category: "Hardware"
description: "Nos stations radio-amateur ont capté une transmission étrange en provenance de NOAA-15. Le signal suit le protocole APT standard : 2080 pixels de large, 2 lignes par seconde, sous-porteuse à 2400 Hz modulée en amplitude. Enregistrement en bande de base, sample rate de 48 kHz.
Mais l'image transmise n'est pas une carte météo.
Quelqu'un semble avoir pris le contrôle du satellite. Démodulez le signal et découvrez son message."

