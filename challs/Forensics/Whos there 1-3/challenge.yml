name: Who's there ? 1-3
category: Réaliste
description: |-
  Un attaquant à réussi à s'introduire sur notre machine, cependant, étant donné la criticité des **services** hebergés sur cette machine, nous ne pouvons pas nous permettre de l'éteindre pour investiguer...

  Connecte-toi à la machine en SSH pour l'examiner en direct. L'attaquant a probablement laissé plusieurs indices sur la machine : retrouve la persistance qu'il a installée ainsi que le fichier malveillant qui lui accorde tous les privilèges.

  Flag: `CYBN{<nom du fichier pour la persistence>:<chemin du fichier pour la charge utile>}`
attribution: Romain
value: 500
type: dynamic

connection_info: ssh user@10.44.10.22 -i whos_ed25519

extra:
  initial: 500
  decay: 30
  minimum: 100

flags:
- content: CYBN{cybn.service:/var/lib/goodboi.ko}
  type: static
  data: case_sensitive

files:
- dist/whos_ed25519

tags:
- Easy
- Forensics

requirements:
    - "Bienvenue !"

next: Who's from ? 2-3

version: '0.1'
