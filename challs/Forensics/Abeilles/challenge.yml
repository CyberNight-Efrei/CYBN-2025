name: Abeilles
category: Forensics
description: |-
  Windows est un système d'exploitation très complexe, dont il est compliqué de comprendre et maitriser tous ses rouages.

  Pour son bon fonctionnement, Windows stocke un très grand nombre d'informations dans des bases de registres. Ces registres impactent à peu près tout sur le système : les profils utilisateurs, les configurations des applications, le système en lui-même, mais aussi par exemple certains secrets, utiles autant aux utilisateurs qu'au système.
  Ces registres sont séparés dans différentes hive - "ruche" en français - et certaines d'entre elles sont particulièrement critiques, car contiennent justement ces secrets, ou bien de quoi les déchiffrer.

  Ces ruches sont alors très souvent ciblées par les attaquants. Une fois récupérées, la machine peut être considérée comme infiltrée au plus profond, sans retour arrière possible.

  ---

  Aujourd'hui, il semblerait qu'une personne mal intentionnée ait accédée à certaines des ruches d'un ordinateur de notre société.

  Sysmon était installé sur la machine, utile pour surveiller les processus. Nous avons donc récupéré pour toi les journaux Windows (.evtx) de Sysmon, afin que tu les analyses, avec les outils adaptés.

  A toi d'analyser les résultats, et de lister les ruches exportées, dans l'ordre alphabétiques, ainsi que le PID du processus Parent ayant effectué cette action.

  Format : `CYBN{RUCHEA_RUCHEB_RUCHEC_1234}`
attribution: NozZy
value: 500
type: dynamic

extra:
  initial: 500
  decay: 30
  minimum: 100

flags:
- CYBN{SAM_SECURITY_SYSTEM_4716}
- CYBN{HKLM\SAM_HKLM\SECURITY_HKLM\SYSTEM_4716}
- CYBN{HKEY_LOCAL_MACHINE\SAM_HKEY_LOCAL_MACHINE\SECURITY_HKEY_LOCAL_MACHINE\SYSTEM_4716}

files:
- src/Microsoft-Windows-Sysmon_Operational.evtx

tags:
- Easy

requirements:
    - "Sanity Check"

version: '0.1'
