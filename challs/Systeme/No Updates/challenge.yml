description: |-
  Je viens d'arriver dans l'entreprise NeuillCORP aujourd'hui, et voilà ce qu'on me dit :
  > Ici on bosse bien, et de manière sécurisée !
  > Pour cette raison, nos serveurs n'ont pas accès à internet, et ne l'ont jamais eu.
  > On met pas non plus à jour, on ne doit pas faire confinace à ce qui ne provient pas de l'entreprise !

  Du coup je dois bosser sur un serveur, mais je compte bien leur prouver qu'il est vulnarable.

