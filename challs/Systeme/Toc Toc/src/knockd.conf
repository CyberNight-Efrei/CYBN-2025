[options]
    logfile = /var/log/knockd
    interface = eth0

[opencloseSSH]
        sequence        = 7854, 1803, 4576
        seq_timeout     = 15
        start_command   = /sbin/iptables -I INPUT 1 -s %IP% -p tcp --dport 22 -j ACCEPT
        tcpflags        = syn
        cmd_timeout     = 30
        stop_command    = /sbin/iptables -D INPUT -s %IP% -p tcp --dport 22 -j ACCEPT
