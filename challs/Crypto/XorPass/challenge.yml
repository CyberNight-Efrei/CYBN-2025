name: XorPass
category: Crypto
description: |-
  Je fais de la cybersécurité, donc je stocke *évidemment* mes mots de passe dans un gestionnaire de mot de passe.
  Puisque je fais de la cybersécurité, je suis *infailliblement* souverain de mes données, et je ne mets rien dans le cloud (berk).
  Etant donnée que je fais de la cybersécurité, je fais *incontestablement* des backup régulières de mon gestionnaire de mot de passe, que je sécurise **moi-même**, avec ma petite clé personnelle.

  J'ai tellement confiance dans mon mécanisme, que je te donne ma dernière backup. Impossible que tu arrives à la lire !
